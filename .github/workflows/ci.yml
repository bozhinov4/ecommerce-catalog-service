name: CI

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/ci.yml
      - .python-version
      - Dockerfile
      - alembic.ini
      - compose.yaml
      - migrations/**
      - pyproject.toml
      - scripts/**
      - src/**
      - tests/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/ci.yml
      - .python-version
      - Dockerfile
      - alembic.ini
      - compose.yaml
      - migrations/**
      - pyproject.toml
      - scripts/**
      - src/**
      - tests/**
      - uv.lock

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_USER: catalog
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog@localhost:5432/catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag ecommerce-catalog-service:ci .
